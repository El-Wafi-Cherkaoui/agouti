name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The oldest version package.json allows, and the current LTS lines.
        node: ["20.17", "22", "24"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      # The tests download a pinned restic into test/.cache.
      - uses: actions/cache@v6
        with:
          path: test/.cache
          key: restic-${{ hashFiles('src/restic.js') }}
      - run: npm test
